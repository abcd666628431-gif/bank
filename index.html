<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>預算與金錢波動規劃器</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->

<body class="p-2 sm:p-4 max-w-xl mx-auto min-h-screen pb-16">

  <!-- 頂部月份導航與雲端狀態 -->
  <div class="flex items-center justify-between mb-3 px-1">
    <div class="flex items-center gap-2">

      </button>
      <h1 id="current-month-label" class="text-base font-bold text-stone-800 tracking-tight">2026 年 10 月</h1>

      </button>

  </div>

  <!-- 當月三大指標卡片 (緊湊多彩樣式) -->
  <div class="grid grid-cols-3 gap-2 mb-3">
    <div class="p-2.5 rounded-2xl bg-gradient-to-br from-emerald-50 to-teal-50 border border-emerald-100 shadow-sm">
      <div class="flex items-center gap-1 text-emerald-800 text-xs font-semibold mb-1">
        <i class="ph ph-arrow-down-left"></i> 收入
      </div>
      <div id="stat-income" class="text-sm font-bold text-emerald-950">$0</div>
    </div>
    <div class="p-2.5 rounded-2xl bg-gradient-to-br from-purple-50 to-indigo-50 border border-purple-100 shadow-sm">
      <div class="flex items-center gap-1 text-purple-800 text-xs font-semibold mb-1">
        <i class="ph ph-lock-key"></i> 固定支出
      </div>
      <div id="stat-fixed" class="text-sm font-bold text-purple-950">$0</div>
    </div>
    <div class="p-2.5 rounded-2xl bg-gradient-to-br from-rose-50 to-orange-50 border border-rose-100 shadow-sm">
      <div class="flex items-center gap-1 text-rose-800 text-xs font-semibold mb-1">
        <i class="ph ph-arrow-up-right"></i> 支出
      </div>
      <div id="stat-expense" class="text-sm font-bold text-rose-950">$0</div>
    </div>
  </div>

  <!-- 分類佔比與進度條 -->
  <div class="bg-white rounded-2xl p-3 border border-stone-200/80 shadow-sm mb-3">
    <div class="flex justify-between items-center text-xs font-bold text-stone-600 mb-2">

    </div>
    <!-- 墨綠光軌進度條 -->
    <div class="w-full bg-stone-100 h-2.5 rounded-full overflow-hidden flex border border-stone-200/50">

    </div>
  </div>

  <!-- 待購買區 (依月份獨立，勾選不消失，鉛筆修改 UI) -->
  <div class="bg-white rounded-2xl p-3.5 border border-stone-200/80 shadow-sm mb-3">
    <div class="flex items-center justify-between mb-2.5">
      <div class="flex items-center gap-2">
        <h2 class="text-sm font-bold text-stone-800">待購買區</h2>
        <span id="wishlist-month-tag" class="text-[10px] px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 font-semibold border border-amber-200">10月專屬</span>
      </div>
      <button id="open-add-wishlist-btn" class="text-xs font-medium text-stone-700 bg-stone-100 hover:bg-stone-200 px-2 py-1 rounded-lg border border-stone-200 flex items-center gap-1">
        <i class="ph ph-plus font-bold"></i> 新增待買
      </button>

    <!-- 待購買雙格統計卡 (全新高質感 UI) -->
    <div class="grid grid-cols-2 gap-2 mb-2.5">
      <div class="p-2 rounded-xl bg-stone-50 border border-stone-200">
        <div class="text-[11px] text-stone-500 font-medium">全部物品總價</div>
        <div id="wishlist-total" class="text-sm font-bold text-stone-800 mt-0.5">$0</div>
      </div>
      <div class="p-2 rounded-xl bg-rose-50/60 border border-rose-200">
        <div class="text-[11px] text-rose-600 font-medium">待備未購金額</div>
        <div id="wishlist-remaining" class="text-sm font-bold text-rose-600 mt-0.5">$0</div>
      </div>
    </div>

    <!-- 已購進度條 -->
    <div class="mb-2">
      <div class="w-full bg-stone-100 h-1.5 rounded-full overflow-hidden">
        <div id="wishlist-progress-bar" class="bg-emerald-600 h-full rounded-full transition-all" style="width: 0%"></div>
      </div>
    </div>

    <!-- 待購買清單列表 -->
    <div id="wishlist-items" class="space-y-1.5 max-h-56 overflow-y-auto custom-scrollbar">
      <!-- 動態載入待買物品 -->
    </div>
  </div>

  <!-- 交易紀錄 (篩選 + 最右側新增按鈕) -->
  <div class="bg-white rounded-2xl p-3.5 border border-stone-200/80 shadow-sm mb-3">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-bold text-stone-800">交易紀錄</h2>
      <div class="flex items-center gap-2">
        <!-- 篩選器 -->
        <div class="flex bg-stone-100 p-0.5 rounded-lg text-[11px] font-medium text-stone-600 border border-stone-200">

          <button class="filter-btn px-2 py-0.5 rounded-md" data-filter="expense">支出</button>
          <button class="filter-btn px-2 py-0.5 rounded-md" data-filter="fixed">固定支出</button>

        <!-- 質感深墨綠微立體「+ 新增」按鍵 (移至最右) -->

    <!-- 交易列表 -->
    <div id="transactions-list" class="space-y-1.5 max-h-72 overflow-y-auto custom-scrollbar">

    </div>
  </div>

  <!-- 最底端：全年金錢波動走勢圖 -->
  <div class="bg-white rounded-2xl p-3.5 border border-stone-200/80 shadow-sm">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center gap-1.5">
        <i class="ph ph-chart-line-up text-emerald-800 font-bold"></i>
        <h2 class="text-sm font-bold text-stone-800">2026 全年金錢波動走勢</h2>
      </div>
      <div class="flex items-center gap-1 text-[11px]">
        <button id="chart-mode-bar" class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-900 font-bold">收支對比</button>
        <button id="chart-mode-line" class="px-2 py-0.5 rounded bg-stone-100 text-stone-600">結餘波浪</button>
      </div>
    </div>
    <div class="h-44 w-full">
      <canvas id="annualChart"></canvas>
    </div>
  </div>

  <!-- ==================== 彈出視窗：新增/修改交易 ==================== -->
  <div id="tx-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-xl border border-stone-200">
      <div class="flex justify-between items-center mb-3">
        <h3 id="tx-modal-title" class="text-sm font-bold text-stone-800">新增交易</h3>
        <button onclick="closeModal('tx-modal')" class="text-stone-400 hover:text-stone-600"><i class="ph ph-x font-bold"></i></button>
      </div>
      <form id="tx-form" class="space-y-2.5 text-xs">
        <input type="hidden" id="tx-id">
        <div>
          <label class="block text-stone-600 font-medium mb-1">類型</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="tx-type-expense" class="py-1.5 rounded-lg border font-semibold border-rose-300 bg-rose-50 text-rose-700">支出</button>
            <button type="button" id="tx-type-income" class="py-1.5 rounded-lg border font-semibold border-stone-200 text-stone-600">收入</button>
          </div>
        </div>
        <div>
          <label class="block text-stone-600 font-medium mb-1">名稱 / 項目</label>
          <input type="text" id="tx-title" required placeholder="如：早餐、房租、薪資" class="w-full px-2.5 py-1.5 rounded-lg border border-stone-200 focus:outline-none focus:border-stone-400">
        </div>
        <div>
          <label class="block text-stone-600 font-medium mb-1">金額</label>
          <input type="number" id="tx-amount" required placeholder="0" class="w-full px-2.5 py-1.5 rounded-lg border border-stone-200 focus:outline-none focus:border-stone-400">
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-stone-600 font-medium">分類</label>
            <button type="button" id="open-cat-manager-btn" class="text-[11px] text-emerald-800 font-bold hover:underline flex items-center gap-0.5">
              <i class="ph ph-gear"></i> 管理類別
            </button>
          </div>
          <select id="tx-category" class="w-full px-2.5 py-1.5 rounded-lg border border-stone-200 focus:outline-none focus:border-stone-400">
            <!-- 動態填充類別 -->
          </select>
        </div>
        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="tx-fixed" class="w-4 h-4 text-emerald-700 rounded border-stone-300">
          <label for="tx-fixed" class="text-stone-700 font-medium cursor-pointer">設為每月固定支出 (自動延續至下月)</label>
        </div>
        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeModal('tx-modal')" class="w-1/2 py-2 rounded-xl bg-stone-100 text-stone-600 font-medium">取消</button>
          <button type="submit" class="w-1/2 py-2 rounded-xl bg-emerald-900 text-white font-medium hover:bg-emerald-950">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== 彈出視窗：新增/修改待購買項目 ==================== -->
  <div id="wishlist-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-xl border border-stone-200">
      <div class="flex justify-between items-center mb-3">
        <h3 id="wishlist-modal-title" class="text-sm font-bold text-stone-800">新增待買物品</h3>
        <button onclick="closeModal('wishlist-modal')" class="text-stone-400 hover:text-stone-600"><i class="ph ph-x font-bold"></i></button>
      </div>
      <form id="wishlist-form" class="space-y-2.5 text-xs">
        <input type="hidden" id="wishlist-id">
        <div>
          <label class="block text-stone-600 font-medium mb-1">物品名稱</label>
          <input type="text" id="wishlist-name" required placeholder="如：降噪耳機、冬裝大衣" class="w-full px-2.5 py-1.5 rounded-lg border border-stone-200 focus:outline-none focus:border-stone-400">
        </div>
        <div>
          <label class="block text-stone-600 font-medium mb-1">預估價格</label>
          <input type="number" id="wishlist-price" required placeholder="0" class="w-full px-2.5 py-1.5 rounded-lg border border-stone-200 focus:outline-none focus:border-stone-400">
        </div>
        <div>
          <label class="block text-stone-600 font-medium mb-1">所屬月份</label>
          <input type="text" id="wishlist-month" readonly class="w-full px-2.5 py-1.5 rounded-lg bg-stone-50 border border-stone-200 text-stone-500">
        </div>
        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeModal('wishlist-modal')" class="w-1/2 py-2 rounded-xl bg-stone-100 text-stone-600 font-medium">取消</button>
          <button type="submit" class="w-1/2 py-2 rounded-xl bg-emerald-900 text-white font-medium hover:bg-emerald-950">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== 彈出視窗：類別管理 (新增/刪除類別) ==================== -->
  <div id="cat-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-4 shadow-xl border border-stone-200">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-sm font-bold text-stone-800">管理交易類別</h3>
        <button onclick="closeModal('cat-modal')" class="text-stone-400 hover:text-stone-600"><i class="ph ph-x font-bold"></i></button>
      </div>
      <!-- 新增類別小表單 -->
      <div class="flex gap-1.5 mb-3">
        <input type="text" id="new-cat-name" placeholder="新類別名稱 (如: 寵物)" class="flex-1 px-2.5 py-1.5 text-xs rounded-lg border border-stone-200 focus:outline-none">
        <button id="add-cat-btn" class="px-3 py-1.5 bg-emerald-900 text-white text-xs font-semibold rounded-lg hover:bg-emerald-950">新增</button>
      </div>
      <div id="categories-list" class="space-y-1.5 max-h-48 overflow-y-auto custom-scrollbar text-xs">
        <!-- 動態列出可刪除類別 -->
      </div>
    </div>
  </div>

  <!-- ==================== Firebase SDK v10 (方案 A) 與應用邏輯 ==================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getAuth, signInAnonymously, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 您的 Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyCNnxw-1bOcdR6SUXaTwkn0bFJGyA3Jtz0",
      authDomain: "bank-39b8f.firebaseapp.com",
      databaseURL: "https://bank-39b8f-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bank-39b8f",
      storageBucket: "bank-39b8f.firebasestorage.app",
      messagingSenderId: "554175411211",
      appId: "1:554175411211:web:832deb99712dcb119c830e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // 全域狀態
    let currentUserId = "guest_user";
    let currentYear = 2026;
    let currentMonth = 10; // 預設 2026-10
    let currentFilter = "all";
    let annualChartInstance = null;
    let chartMode = "bar"; // bar or line

    // 資料狀態
    let transactions = [];
    let wishlistItems = [];
    let categories = [
      { id: "c1", name: "飲食", color: "#f97316", icon: "ph-fork-knife" },
      { id: "c2", name: "交通", color: "#0ea5e9", icon: "ph-car" },
      { id: "c3", name: "購物", color: "#a855f7", icon: "ph-bag" },
      { id: "c4", name: "固定支出", color: "#8b5cf6", icon: "ph-repeat" },
      { id: "c5", name: "薪資", color: "#10b981", icon: "ph-coins" },
      { id: "c6", name: "其他", color: "#64748b", icon: "ph-dots-three" }
    ];

    // 初始化 Firebase 身分認證與監聽
    signInAnonymously(auth).catch(err => {
      console.warn("匿名驗證失敗:", err);
      document.getElementById('sync-status-text').textContent = "本地模式 (未同步)";
    });

    onAuthStateChanged(auth, user => {
      if (user) {
        currentUserId = user.uid;
        document.getElementById('sync-status-text').textContent = "已連線雲端";
        setupFirestoreListeners();
      }
    });

    // 監聽 Firestore 資料
    function setupFirestoreListeners() {
      // 1. 交易紀錄監聽
      onSnapshot(collection(db, "users", currentUserId, "transactions"), snap => {
        transactions = [];
        snap.forEach(d => transactions.push({ id: d.id, ...d.data() }));
        renderAll();
      });

      // 2. 待購買清單監聽
      onSnapshot(collection(db, "users", currentUserId, "wishlist"), snap => {
        wishlistItems = [];
        snap.forEach(d => wishlistItems.push({ id: d.id, ...d.data() }));
        renderAll();
      });

      // 3. 類別清單監聽
      onSnapshot(collection(db, "users", currentUserId, "categories"), snap => {
        if (!snap.empty) {
          const cloudCats = [];
          snap.forEach(d => cloudCats.push({ id: d.id, ...d.data() }));
          categories = cloudCats;
        }
        renderCategories();
        renderAll();
      });
    }

    // 當前月份字串 YYYY-MM
    function getMonthStr() {
      return `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
    }

    // 格式化貨幣
    function fmt(n) {
      return "$" + Number(n || 0).toLocaleString();
    }

    // 渲染所有畫面
    function renderAll() {
      const monthStr = getMonthStr();
      document.getElementById('current-month-label').textContent = `${currentYear} 年 ${currentMonth} 月`;
      document.getElementById('wishlist-month-tag').textContent = `${currentMonth} 月專屬`;

      // 1. 當月交易計算
      const monthTxs = transactions.filter(t => t.date && t.date.startsWith(monthStr));
      let totalIncome = 0;
      let totalExpense = 0;
      let totalFixed = 0;

      monthTxs.forEach(t => {
        const amt = Number(t.amount) || 0;
        if (t.type === 'income') {
          totalIncome += amt;
        } else {
          totalExpense += amt;
          if (t.isFixed || t.category === "固定支出") {
            totalFixed += amt;
          }
        }
      });

      document.getElementById('stat-income').textContent = fmt(totalIncome);
      document.getElementById('stat-expense').textContent = fmt(totalExpense);
      document.getElementById('stat-fixed').textContent = fmt(totalFixed);

      // 進度條
      const ratio = totalIncome > 0 ? Math.min(Math.round((totalExpense / totalIncome) * 100), 100) : (totalExpense > 0 ? 100 : 0);
      document.getElementById('budget-percent-text').textContent = `${ratio}%`;
      document.getElementById('budget-progress-bar').style.width = `${ratio}%`;

      // 2. 待購買清單 (依月份嚴格獨立)
      const currentMonthWishlist = wishlistItems.filter(item => item.month === monthStr);
      let wishTotal = 0;
      let wishBought = 0;

      const wishlistContainer = document.getElementById('wishlist-items');
      wishlistContainer.innerHTML = '';

      if (currentMonthWishlist.length === 0) {
        wishlistContainer.innerHTML = `<div class="text-center py-4 text-xs text-stone-400">本月尚無待購買項目</div>`;
      } else {
        currentMonthWishlist.forEach(item => {
          const price = Number(item.price) || 0;
          wishTotal += price;
          if (item.bought) wishBought += price;

          const el = document.createElement('div');
          el.className = `flex items-center justify-between p-2 rounded-xl border transition-all ${
            item.bought ? 'bg-stone-50/60 border-stone-200' : 'bg-white border-stone-200'
          }`;
          el.innerHTML = `
            <div class="flex items-center gap-2 flex-1 min-w-0">
              <input type="checkbox" ${item.bought ? 'checked' : ''} class="w-4 h-4 rounded text-emerald-800 toggle-wish" data-id="${item.id}">
              <span class="text-xs truncate ${item.bought ? 'line-through text-stone-400 font-medium' : 'text-stone-800 font-bold'}">${item.name}</span>
              ${item.bought ? '<span class="text-[9px] px-1.5 py-0.5 rounded bg-stone-200 text-stone-600 font-semibold">已購</span>' : ''}
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold ${item.bought ? 'line-through text-stone-400' : 'text-stone-800'}">${fmt(price)}</span>
              <!-- 鉛筆修改 UI -->
              <button class="edit-wish-btn text-stone-400 hover:text-emerald-700" data-id="${item.id}">
                <i class="ph ph-pencil-simple font-bold"></i>
              </button>
              <button class="del-wish-btn text-stone-300 hover:text-rose-500" data-id="${item.id}">
                <i class="ph ph-trash"></i>
              </button>
            </div>
          `;
          wishlistContainer.appendChild(el);
        });
      }

      document.getElementById('wishlist-total').textContent = fmt(wishTotal);
      const remaining = Math.max(0, wishTotal - wishBought);
      document.getElementById('wishlist-remaining').textContent = fmt(remaining);
      const wishRatio = wishTotal > 0 ? Math.round((wishBought / wishTotal) * 100) : 0;
      document.getElementById('wishlist-progress-bar').style.width = `${wishRatio}%`;

      // 3. 交易紀錄清單
      const txContainer = document.getElementById('transactions-list');
      txContainer.innerHTML = '';

      let filteredTxs = monthTxs;
      if (currentFilter === 'expense') filteredTxs = monthTxs.filter(t => t.type === 'expense' && !t.isFixed && t.category !== "固定支出");
      else if (currentFilter === 'fixed') filteredTxs = monthTxs.filter(t => t.isFixed || t.category === "固定支出");
      else if (currentFilter === 'income') filteredTxs = monthTxs.filter(t => t.type === 'income');

      if (filteredTxs.length === 0) {
        txContainer.innerHTML = `<div class="text-center py-4 text-xs text-stone-400">查無交易明細</div>`;
      } else {
        filteredTxs.sort((a,b) => (b.date || "").localeCompare(a.date || "")).forEach(t => {
          const cat = categories.find(c => c.name === t.category) || { color: '#64748b', icon: 'ph-receipt' };
          const el = document.createElement('div');
          el.className = "flex items-center justify-between p-2 rounded-xl bg-stone-50 border border-stone-200/80";
          el.innerHTML = `
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded-lg flex items-center justify-center text-white" style="background-color: ${cat.color}">
                <i class="ph ${cat.icon} text-sm"></i>
              </div>
              <div>
                <div class="text-xs font-bold text-stone-800 flex items-center gap-1">
                  ${t.title}
                  ${t.isFixed ? '<span class="text-[9px] px-1 rounded bg-purple-100 text-purple-700">固定</span>' : ''}
                </div>
                <div class="text-[10px] text-stone-400">${t.date} · ${t.category}</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold ${t.type === 'income' ? 'text-emerald-700' : 'text-rose-600'}">
                ${t.type === 'income' ? '+' : '-'}${fmt(t.amount)}
              </span>
              <button class="del-tx-btn text-stone-300 hover:text-rose-500" data-id="${t.id}"><i class="ph ph-trash"></i></button>
            </div>
          `;
          txContainer.appendChild(el);
        });
      }

      // 4. 更新底端全年走勢圖
      renderAnnualChart();
    }

    // 渲染全年金錢走勢圖
    function renderAnnualChart() {
      const months = Array.from({ length: 12 }, (_, i) => i + 1);
      const labels = months.map(m => `${m}月`);
      const incomeData = [];
      const expenseData = [];
      const netData = [];

      months.forEach(m => {
        const mKey = `${currentYear}-${String(m).padStart(2, '0')}`;
        const mTxs = transactions.filter(t => t.date && t.date.startsWith(mKey));
        let inc = 0, exp = 0;
        mTxs.forEach(t => {
          if (t.type === 'income') inc += Number(t.amount) || 0;
          else exp += Number(t.amount) || 0;
        });
        incomeData.push(inc);
        expenseData.push(exp);
        netData.push(inc - exp);
      });

      const ctx = document.getElementById('annualChart').getContext('2d');
      if (annualChartInstance) annualChartInstance.destroy();

      if (chartMode === 'bar') {
        annualChartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: '收入', data: incomeData, backgroundColor: '#10b981', borderRadius: 4 },
              { label: '支出', data: expenseData, backgroundColor: '#f43f5e', borderRadius: 4 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'top', labels: { boxWidth: 10, font: { size: 10 } } } },
            scales: { x: { grid: { display: false } }, y: { grid: { color: '#f1f5f9' } } },
            onClick: (e, items) => {
              if (items.length > 0) {
                currentMonth = items[0].index + 1;
                handleMonthChange();
              }
            }
          }
        });
      } else {
        annualChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: '淨結餘波浪',
              data: netData,
              borderColor: '#059669',
              backgroundColor: 'rgba(16, 185, 129, 0.1)',
              fill: true,
              tension: 0.4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { grid: { display: false } }, y: { grid: { color: '#f1f5f9' } } },
            onClick: (e, items) => {
              if (items.length > 0) {
                currentMonth = items[0].index + 1;
                handleMonthChange();
              }
            }
          }
        });
      }
    }

    // 固定支出自動延續至下月
    async function carryOverFixedExpenses() {
      const targetMonthStr = getMonthStr();
      const fixedTxs = transactions.filter(t => t.isFixed || t.category === "固定支出");
      
      for (const item of fixedTxs) {
        const alreadyExists = transactions.some(
          t => t.date && t.date.startsWith(targetMonthStr) && t.title === item.title && (t.isFixed || t.category === "固定支出")
        );
        if (!alreadyExists) {
          await addDoc(collection(db, "users", currentUserId, "transactions"), {
            title: item.title,
            amount: item.amount,
            type: "expense",
            category: item.category || "固定支出",
            isFixed: true,
            date: `${targetMonthStr}-01`
          });
        }
      }
    }

    function handleMonthChange() {
      carryOverFixedExpenses().then(() => renderAll());
    }

    // 渲染分類下拉與管理列表
    function renderCategories() {
      const select = document.getElementById('tx-category');
      select.innerHTML = '';
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.name;
        opt.textContent = c.name;
        select.appendChild(opt);
      });

      const catList = document.getElementById('categories-list');
      catList.innerHTML = '';
      categories.forEach(c => {
        const row = document.createElement('div');
        row.className = "flex items-center justify-between p-1.5 rounded-lg bg-stone-50 border border-stone-200";
        row.innerHTML = `
          <div class="flex items-center gap-1.5">
            <span class="w-3 h-3 rounded-full" style="background-color: ${c.color}"></span>
            <span class="font-medium text-stone-700">${c.name}</span>
          </div>
          <button class="del-cat-btn text-stone-300 hover:text-rose-500" data-id="${c.id}"><i class="ph ph-trash"></i></button>
        `;
        catList.appendChild(row);
      });
    }

    // 視窗開啟/關閉輔助
    window.closeModal = function(id) {
      document.getElementById(id).classList.add('hidden');
    };

    // 事件監聽綁定
    document.addEventListener('DOMContentLoaded', () => {
      renderCategories();
      renderAll();

      // 月份跳轉
      document.getElementById('prev-month-btn').onclick = () => {
        if (currentMonth === 1) { currentMonth = 12; currentYear--; } else { currentMonth--; }
        handleMonthChange();
      };
      document.getElementById('next-month-btn').onclick = () => {
        if (currentMonth === 12) { currentMonth = 1; currentYear++; } else { currentMonth++; }
        handleMonthChange();
      };

      // 走勢圖模式切換
      document.getElementById('chart-mode-bar').onclick = function() {
        chartMode = 'bar';
        this.className = "px-2 py-0.5 rounded bg-emerald-100 text-emerald-900 font-bold";
        document.getElementById('chart-mode-line').className = "px-2 py-0.5 rounded bg-stone-100 text-stone-600";
        renderAnnualChart();
      };
      document.getElementById('chart-mode-line').onclick = function() {
        chartMode = 'line';
        this.className = "px-2 py-0.5 rounded bg-emerald-100 text-emerald-900 font-bold";
        document.getElementById('chart-mode-bar').className = "px-2 py-0.5 rounded bg-stone-100 text-stone-600";
        renderAnnualChart();
      };

      // 交易篩選按鈕
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.className = "filter-btn px-2 py-0.5 rounded-md";
          });
          b.className = "filter-btn px-2 py-0.5 rounded-md bg-white text-stone-800 shadow-sm";
          currentFilter = b.dataset.filter;
          renderAll();
        };
      });

      // 彈窗開啟：新增交易
      document.getElementById('open-add-tx-btn').onclick = () => {
        document.getElementById('tx-modal-title').textContent = "新增交易";
        document.getElementById('tx-form').reset();
        document.getElementById('tx-id').value = '';
        document.getElementById('tx-modal').classList.remove('hidden');
      };

      // 彈窗開啟：新增待買
      document.getElementById('open-add-wishlist-btn').onclick = () => {
        document.getElementById('wishlist-modal-title').textContent = "新增待買物品";
        document.getElementById('wishlist-form').reset();
        document.getElementById('wishlist-id').value = '';
        document.getElementById('wishlist-month').value = getMonthStr();
        document.getElementById('wishlist-modal').classList.remove('hidden');
      };

      // 彈窗開啟：管理類別
      document.getElementById('open-cat-manager-btn').onclick = () => {
        document.getElementById('cat-modal').classList.remove('hidden');
      };

      // 儲存待購買項目
      document.getElementById('wishlist-form').onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('wishlist-id').value;
        const name = document.getElementById('wishlist-name').value.trim();
        const price = Number(document.getElementById('wishlist-price').value) || 0;
        const month = getMonthStr();

        if (id) {
          await updateDoc(doc(db, "users", currentUserId, "wishlist", id), { name, price });
        } else {
          await addDoc(collection(db, "users", currentUserId, "wishlist"), {
            name, price, month, bought: false
          });
        }
        closeModal('wishlist-modal');
      };

      // 儲存交易
      let txType = 'expense';
      document.getElementById('tx-type-expense').onclick = () => {
        txType = 'expense';
        document.getElementById('tx-type-expense').className = "py-1.5 rounded-lg border font-semibold border-rose-300 bg-rose-50 text-rose-700";
        document.getElementById('tx-type-income').className = "py-1.5 rounded-lg border font-semibold border-stone-200 text-stone-600";
      };
      document.getElementById('tx-type-income').onclick = () => {
        txType = 'income';
        document.getElementById('tx-type-income').className = "py-1.5 rounded-lg border font-semibold border-emerald-300 bg-emerald-50 text-emerald-700";
        document.getElementById('tx-type-expense').className = "py-1.5 rounded-lg border font-semibold border-stone-200 text-stone-600";
      };

      document.getElementById('tx-form').onsubmit = async (e) => {
        e.preventDefault();
        const title = document.getElementById('tx-title').value.trim();
        const amount = Number(document.getElementById('tx-amount').value) || 0;
        const category = document.getElementById('tx-category').value;
        const isFixed = document.getElementById('tx-fixed').checked;
        const date = `${getMonthStr()}-01`;

        await addDoc(collection(db, "users", currentUserId, "transactions"), {
          title, amount, type: txType, category, isFixed, date
        });
        closeModal('tx-modal');
      };

      // 新增分類
      document.getElementById('add-cat-btn').onclick = async () => {
        const name = document.getElementById('new-cat-name').value.trim();
        if (!name) return;
        const newCat = {
          name,
          color: '#' + Math.floor(Math.random()*16777215).toString(16),
          icon: 'ph-tag'
        };
        await addDoc(collection(db, "users", currentUserId, "categories"), newCat);
        document.getElementById('new-cat-name').value = '';
      };

      // 委託監聽：待買區切換勾選 (不消失)、筆 UI 修改、刪除
      document.getElementById('wishlist-items').addEventListener('click', async (e) => {
        const chk = e.target.closest('.toggle-wish');
        if (chk) {
          const id = chk.dataset.id;
          await updateDoc(doc(db, "users", currentUserId, "wishlist", id), { bought: chk.checked });
          return;
        }

        const editBtn = e.target.closest('.edit-wish-btn');
        if (editBtn) {
          const id = editBtn.dataset.id;
          const item = wishlistItems.find(w => w.id === id);
          if (item) {
            document.getElementById('wishlist-modal-title').textContent = "修改待買物品";
            document.getElementById('wishlist-id').value = item.id;
            document.getElementById('wishlist-name').value = item.name;
            document.getElementById('wishlist-price').value = item.price;
            document.getElementById('wishlist-month').value = item.month || getMonthStr();
            document.getElementById('wishlist-modal').classList.remove('hidden');
          }
          return;
        }

        const delBtn = e.target.closest('.del-wish-btn');
        if (delBtn) {
          await deleteDoc(doc(db, "users", currentUserId, "wishlist", delBtn.dataset.id));
        }
      });

      // 委託監聽：刪除交易
      document.getElementById('transactions-list').addEventListener('click', async (e) => {
        const delBtn = e.target.closest('.del-tx-btn');
        if (delBtn) {
          await deleteDoc(doc(db, "users", currentUserId, "transactions", delBtn.dataset.id));
        }
      });

      // 委託監聽：刪除類別
      document.getElementById('categories-list').addEventListener('click', async (e) => {
        const delBtn = e.target.closest('.del-cat-btn');
        if (delBtn) {
          await deleteDoc(doc(db, "users", currentUserId, "categories", delBtn.dataset.id));
        }
      });
    });
  </script>
</body>
</html>
